<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink Room Clicker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  background:
    linear-gradient(#c68ba0, #a86f86);

  font-family: "Courier New", monospace;
  color: #5d3847;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 25px;
}

/* =========================
   GAME WINDOW
========================= */

.game {
  width: 1040px;
  max-width: 100%;

  background: #f7d5df;

  border: 5px solid #704758;

  box-shadow:
    8px 8px 0 #4e303c,
    inset 0 0 0 3px #fff0f4;

  padding: 16px;
}

/* =========================
   HEADER
========================= */

.header {
  background: #fff0f4;

  border: 4px solid #936174;

  box-shadow: 4px 4px 0 #b8788e;

  padding: 10px;

  text-align: center;

  margin-bottom: 15px;
}

.title {
  font-weight: bold;
  letter-spacing: 2px;
  font-size: 20px;
}

#score {
  margin-top: 4px;
  font-size: 25px;
  color: #ac5071;
  font-weight: bold;
}

#power {
  font-size: 12px;
  margin-top: 3px;
}

/* =========================
   LAYOUT
========================= */

.content {
  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    230px;

  gap: 16px;
}

/* =========================
   ROOM
========================= */

.room-area {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.room-frame {
  background: #583843;
  padding: 5px;

  box-shadow:
    5px 5px 0 #3c2730;
}

canvas {
  display: block;

  /*
    Internal resolution = 480x360.

    Browser enlarges it,
    but smoothing is disabled,
    so the pixels stay sharp.
  */

  width: 768px;
  max-width: 100%;

  image-rendering: pixelated;
  image-rendering: crisp-edges;

  background: black;
}

/* =========================
   BUTTON
========================= */

#decorate {
  margin-top: 18px;

  width: 270px;
  height: 73px;

  border: 4px solid #754457;

  background: #dc769b;

  color: white;

  font-weight: bold;
  font-size: 18px;

  font-family: inherit;

  cursor: pointer;

  box-shadow:
    0 6px 0 #9b506a,
    0 9px 0 #633848;
}

#decorate:hover {
  background: #e788aa;
}

#decorate:active {
  transform: translateY(5px);

  box-shadow:
    0 1px 0 #9b506a,
    0 4px 0 #633848;
}

#message {
  margin-top: 13px;

  min-height: 19px;

  font-size: 12px;
  font-weight: bold;

  text-align: center;

  color: #9b4968;
}

#next {
  font-size: 11px;
  margin-top: 6px;
}

/* =========================
   SHOP
========================= */

.shop {
  background: #f2bccc;

  border: 4px solid #815063;

  box-shadow: 5px 5px 0 #5c3947;

  padding: 11px;

  height: fit-content;
}

.shop-title {
  text-align: center;

  margin-bottom: 10px;

  font-size: 16px;
  font-weight: bold;
}

.boost {
  background: #ffe5ec;

  border: 3px solid #a4657c;

  padding: 9px;

  margin-bottom: 10px;
}

.boost-name {
  font-size: 12px;
  font-weight: bold;
}

.boost-description {
  font-size: 10px;

  margin:
    5px 0
    8px;

  line-height: 1.4;
}

.boost button {
  width: 100%;

  background: #cf6487;

  border: 3px solid #784759;

  color: white;

  padding: 6px;

  font-family: inherit;

  font-size: 11px;

  font-weight: bold;

  cursor: pointer;
}

.boost button:disabled {
  background: #c9a3af;
  color: #806872;
  cursor: default;
}

@media(max-width: 900px) {

  .content {
    grid-template-columns: 1fr;
  }

  .shop {
    width: 100%;
  }
}
</style>
</head>

/* =========================================================
   SETUP
========================================================= */

const canvas =
  document.getElementById("room");

const ctx =
  canvas.getContext("2d");


ctx.imageSmoothingEnabled = false;


let score = 0;

let totalEarned = 0;

let clickPower = 1;



/* =========================================================
   BASIC DRAWING HELPERS
========================================================= */

function rect(
  x,
  y,
  width,
  height,
  color
) {

  ctx.fillStyle = color;

  ctx.fillRect(
    x,
    y,
    width,
    height
  );
}



function pixel(
  x,
  y,
  color
) {

  rect(
    x,
    y,
    2,
    2,
    color
  );
}

  let x = 0;
  x < 480;
  x += 40

  },

  {
    score: 220,
    name: "House Plant"
  },

  {
    score: 270,
    name: "Wall Decorations"
  },

  {
    score: 330,
    name: "Fairy Lights"
  }

];


let unlocked =
  new Set();


function checkUnlocks() {

for (
  const item
  of unlocks
) {

  if (
    totalEarned >= item.score &&
    !unlocked.has(item.score)
  ) {

    unlocked.add(
      item.score
    );

    document
      .getElementById(
        "message"
      )
      .textContent =
        "♡ " +
        item.name +
        " unlocked! ♡";

  }

}


updateNextItem();

}



function updateNextItem() {

const nextItem =
  unlocks.find(
    item =>
      totalEarned <
      item.score
  );


const nextText =
  document
  .getElementById(
    "next"
  );


if (
  nextItem
) {

  nextText.textContent =
    "Next: " +
    nextItem.name +
    " at " +
    nextItem.score;

}

else {

  nextText.textContent =
    "♡ Room complete ♡";

}

}



/* =========================================================
   CLICK
========================================================= */

document
  .getElementById(
    "decorate"
  )
  .addEventListener(
    "click",
    () => {

      score +=
        clickPower;

      totalEarned +=
        clickPower;


      checkUnlocks();

      redraw();

      updateUI();

    }
  );



/* =========================================================
   BOOST SYSTEM
========================================================= */

const boosts = [

  {
    id: "boost1",
    cost: 20,
    bonus: 1,
    purchased: false
  },

  {
    id: "boost2",
    cost: 65,
    bonus: 3,
    purchased: false
  },

  {
    id: "boost3",
    cost: 160,
    bonus: 6,
    purchased: false
  }

];


boosts.forEach(
  boost => {

    const button =
      document.getElementById(
        boost.id
      );


    button.addEventListener(
      "click",
      () => {

        if (
          score >= boost.cost &&
          !boost.purchased
        ) {

          score -=
            boost.cost;


          clickPower +=
            boost.bonus;


          boost.purchased =
            true;


          button.textContent =
            "BOUGHT ♡";


          button.disabled =
            true;


          document
            .getElementById(
              "message"
            )
            .textContent =
              "♡ Click power is now +" +
              clickPower +
              "!";


          updateUI();

        }

      }
    );

  }
);



/* =========================================================
   UI
========================================================= */

function updateUI() {

document
  .getElementById(
    "score"
  )
  .textContent =
    score;


document
  .getElementById(
    "power"
  )
  .textContent =
    "+" +
    clickPower +
    " per click";


boosts.forEach(
  boost => {

    const button =
      document.getElementById(
        boost.id
      );


    if (
      !boost.purchased
    ) {

      button.disabled =
        score <
        boost.cost;

    }

  }
);

}



/* =========================================================
   INITIALIZE
========================================================= */

redraw();

updateUI();

updateNextItem();

</script>
